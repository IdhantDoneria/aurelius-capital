<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelius — Research Director</title>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2330; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#388bfd;
    --now:#3fb950; --delay:#d29922; --reject:#f85149; --merge:#a371f7;
    --archive:#6e7681; --escalate:#db61a2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{padding:16px 24px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:16px;background:var(--surface)}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}
  header button{margin-left:auto;background:var(--accent);color:#fff;border:0;
    padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  header button:hover{opacity:.9}
  main{padding:24px;max-width:1400px;margin:0 auto}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:0 0 12px}
  .kpi{font-size:30px;font-weight:700}
  .kpi small{font-size:13px;color:var(--muted);font-weight:400}
  .section{margin-top:24px}
  .section h2{font-size:15px;margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
    display:flex;gap:6px;align-items:center;background:var(--surface2)}
  .chip b{font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:var(--surface2)}
  .badge{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .stmt{color:var(--muted);font-size:12px;max-width:420px}
  .why{color:var(--muted);font-size:11px;margin-top:2px;max-width:420px}
  .queues{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .queue h3{margin:0 0 4px;font-size:13px}
  .queue .load{color:var(--muted);font-size:11px;margin-bottom:8px}
  .queue ul{list-style:none;margin:0;padding:0}
  .queue li{display:flex;justify-content:space-between;padding:5px 0;
    border-bottom:1px solid var(--border);font-size:12px;gap:8px}
  .queue li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--muted)}
  #err{color:var(--reject);padding:12px 0}
  .loading{color:var(--muted);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Research Director</h1>
  <span class="sub" id="ts">—</span>
  <button onclick="load()">Refresh</button>
</header>
<main>
  <div id="err"></div>
  <div id="content"><div class="loading">Loading research state…</div></div>
</main>
<script>
const DECISION_COLORS = {
  research_now:"var(--now)", delay:"var(--delay)", reject:"var(--reject)",
  merge:"var(--merge)", archive:"var(--archive)", escalate:"var(--escalate)"
};
const esc = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function load(){
  const err = document.getElementById("err");
  err.textContent = "";
  try{
    const d = await (await fetch("/director/dashboard")).json();
    render(d);
  }catch(e){
    err.textContent = "Failed to load: "+e.message;
  }
}

function kpiCards(d){
  const dec = d.decisions||{};
  const util = d.resource_utilization||{};
  const learn = d.learning||{};
  const cards = [
    ["Backlog", d.backlog_size ?? 0, "actionable ideas"],
    ["Research now", dec.research_now ?? 0, "ready to run"],
    ["Escalations", dec.escalate ?? 0, "need review"],
    ["Daily load", (util.daily_load_min ?? 0)+"m", "of "+(util.daily_capacity_min ?? 0)+"m budget"],
    ["Velocity", learn.velocity_experiments_per_week ?? 0, "exp / week"],
    ["Accept rate", learn.overall_accept_rate==null?"—":Math.round(learn.overall_accept_rate*100)+"%", "of experiments"],
  ];
  return `<div class="grid">${cards.map(([t,v,s])=>`
    <div class="card"><h2>${t}</h2><div class="kpi">${esc(v)} <small>${esc(s)}</small></div></div>`).join("")}</div>`;
}

function decisionChips(dec){
  return `<div class="chips">${Object.entries(dec).map(([k,v])=>`
    <span class="chip"><span class="dot" style="background:${DECISION_COLORS[k]||'#888'}"></span>
    ${esc(k)} <b>${v}</b></span>`).join("")}</div>`;
}

function priorityRows(items){
  return items.map(r=>{
    const c = DECISION_COLORS[r.decision]||"#888";
    const pct = Math.round((r.overall||0)*100);
    return `<tr>
      <td><div class="bar"><i style="width:${pct}%"></i></div>
          <div class="muted">${(r.overall).toFixed(3)}</div></td>
      <td><span class="badge" style="background:${c}">${esc(r.decision)}</span></td>
      <td>${esc(r.category)}</td>
      <td><div class="stmt">${esc(r.statement)}</div><div class="why">${esc(r.explanation)}</div></td>
      <td class="muted">${r.resources?esc(r.resources.runtime_min)+"m":"—"}</td>
    </tr>`;
  }).join("");
}

function queueBlock(name,items,load){
  const rows = (items||[]).map(i=>`<li><span>${esc(i.hypothesis_id.slice(0,8))} · ${esc(i.category)}</span>
    <span class="muted">${(i.priority).toFixed(2)} · ${esc(i.runtime_min)}m</span></li>`).join("")
    || `<li class="muted">empty</li>`;
  return `<div class="queue card"><h3>${esc(name)}</h3>
    <div class="load">${(items||[]).length} items · ${esc(load||0)}m load</div>
    <ul>${rows}</ul></div>`;
}

function gapsBlock(g){
  if(!g) return "";
  const list = (arr,f)=>(arr||[]).slice(0,6).map(f).join("")||'<li class="muted">none</li>';
  return `<div class="queues">
    <div class="card"><h3>Over-researched</h3><ul>${
      list(g.over_researched,x=>`<li>${esc(x.category)} <span class="muted">${Math.round(x.share*100)}% · ${x.count}</span></li>`)}</ul></div>
    <div class="card"><h3>Under-researched</h3><ul>${
      list(g.under_researched,x=>`<li>${esc(x.category)} <span class="muted">${x.count}</span></li>`)}</ul></div>
    <div class="card"><h3>Frequently failing</h3><ul>${
      list(g.frequently_failing,x=>`<li>${esc(x.category)} <span class="muted">${x.trials} trials · ${Math.round(x.accept_rate*100)}%</span></li>`)}</ul></div>
    <div class="card"><h3>Missing datasets (cited, untested)</h3><ul>${
      list(g.missing_datasets,x=>`<li>${esc(x.dataset||x.label)} <span class="muted">${x.paper_citations||''}</span></li>`)}</ul></div>
  </div>`;
}

async function render(d){
  document.getElementById("ts").textContent = "as of "+new Date(d.generated_at).toLocaleString();
  const rmap = await (await fetch("/director/roadmap")).json();
  const gaps = await (await fetch("/director/gaps")).json();
  document.getElementById("content").innerHTML = `
    ${kpiCards(d)}
    <div class="section"><h2>Decision breakdown</h2>${decisionChips(d.decisions||{})}</div>
    <div class="section"><h2>Top priorities</h2>
      <div class="card"><table>
      <thead><tr><th>Priority</th><th>Decision</th><th>Category</th><th>Hypothesis</th><th>Runtime</th></tr></thead>
      <tbody>${priorityRows(d.top_priorities||[])}</tbody></table></div></div>
    <div class="section"><h2>Research queues</h2><div class="queues">
      ${queueBlock("Daily",rmap.daily,rmap.daily_load_min)}
      ${queueBlock("Weekly",rmap.weekly,rmap.weekly_load_min)}
      ${queueBlock("Monthly",rmap.monthly,rmap.monthly_load_min)}
      ${queueBlock("Quarterly",rmap.quarterly,rmap.quarterly_load_min)}
    </div></div>
    <div class="section"><h2>Research gaps</h2>${gapsBlock(gaps)}</div>`;
}
load();
</script>
</body>
</html>
