[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentisrex-capital"
version = "0.1.0"
description = "Institutional-grade quantitative research and trading platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[asyncio]>=5.2.0",
    "structlog>=24.4.0",
    "python-json-logger>=3.2.0",
    "yfinance>=0.2.40",
    "websockets>=13.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "pyarrow>=17.0.0",
]

[project.scripts]
mrx = "mentisrex.programme.cli:main"

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
]
# Only used by scripts/fetch_nse_bhavcopy.py, which already handles it being
# absent (prints an install hint and exits rather than crashing). Kept out of
# core `dependencies` because jugaad-data has never released a 2.x version --
# the prior ">=2.9.0" pin was unsatisfiable on PyPI (real ceiling: 0.35.x) and
# broke `pip install ".[dev]"` for everyone, including CI, from the first
# resolve.
india = [
    "jugaad-data",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mentisrex"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "PT", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in function defaults
    "E501",   # Line too long
    # Math notation, not sloppy naming: this is a quant-research codebase where
    # formula docstrings use Greek letters / proper minus signs (RUF001-003:
    # "ambiguous unicode character") and code mirrors paper notation with
    # single-letter names like H (horizon), N (count), T (periods) (N803/805/
    # 806/812/814: non-lowercase / non-snake_case naming). Both categories were
    # spot-checked before disabling -- e.g. svi.py's "w(k) = a + b*(rho*(k - m)
    # + sqrt(...))" and test_hac_and_purged_cv.py's `H` matching the actual
    # `label_horizon` parameter it's passed as -- and are intentional
    # throughout src/ and tests/, not isolated mistakes.
    "RUF001", "RUF002", "RUF003",
    "N803", "N805", "N806", "N812", "N814",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "RUF043", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_any_generics = false
warn_return_any = false
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests, no I/O",
    "integration: requires running Docker stack",
    "slow: benchmarks and long-running tests (excluded from default CI run)",
    "real_alpaca: requires ALPACA_PAPER_API_KEY / ALPACA_PAPER_API_SECRET (M28, excluded from offline CI)",
    "real_data: requires live network access to a real data provider (M27, excluded from offline CI)",
]
addopts = "-v --tb=short -m \"not real_alpaca and not real_data\""

[tool.coverage.run]
source = ["src/mentisrex"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
