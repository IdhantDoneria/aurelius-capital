[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mentisrex-capital"
version = "0.1.0"
description = "Institutional-grade quantitative research and trading platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[asyncio]>=5.2.0",
    "structlog>=24.4.0",
    "python-json-logger>=3.2.0",
    "yfinance>=0.2.40",
    "websockets>=13.0",
    "duckdb>=1.1.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mentisrex"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "PT", "RUF"]
ignore = ["B008", "E501"]  # FastAPI Depends() in function defaults + Line too long

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "RUF043", "RUF003", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_any_generics = false
warn_return_any = false
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests, no I/O",
    "integration: requires running Docker stack",
    "slow: benchmarks and long-running tests (excluded from default CI run)",
    "real_alpaca: requires ALPACA_PAPER_API_KEY / ALPACA_PAPER_API_SECRET (M28, excluded from offline CI)",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/mentisrex"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
